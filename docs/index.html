<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pitwall Live · F1 data dashboard</title>
  <meta name="description" content="Timing, lap analysis, tyre strategy, telemetry and live track map for every Formula 1 session.">
  <meta name="theme-color" content="#0a0a0d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pitwall">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta property="og:title" content="Pitwall Live">
  <meta property="og:description" content="Timing, lap analysis, tyre strategy, telemetry and live track map for every Formula 1 session.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0c10'/%3E%3Cpath d='M12 5h8l-5 22H7z' fill='%23ff2d20'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Barlow+Condensed:ital,wght@1,600;1,700;1,800;1,900&display=swap">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="welcome" id="welcome" role="dialog" aria-modal="true" aria-labelledby="w-h1" hidden>
    <div class="w-wrap">
      <div class="w-nav">
        <div class="brand"><i></i>Pitwall<span class="brand-live">&nbsp;Live</span></div>
        <div class="w-nav-r"><select id="w-lang" class="btn" data-i18n-aria="aria.language"></select><a class="btn" id="w-sponsor" href="#" target="_blank" rel="noopener" hidden data-i18n="btn.donate"></a></div>
      </div>
      <section class="w-hero">
        <div class="w-copy">
          <p class="w-eyebrow num"><span class="dot"></span><span data-i18n="welcome.eyebrow"></span></p>
          <h1 id="w-h1"><span data-i18n="welcome.h1a"></span><br><span data-i18n="welcome.h1b"></span><br><em data-i18n="welcome.h1c"></em></h1>
          <p class="w-sub" data-i18n="welcome.sub"></p>
          <div class="w-cta"><button type="button" class="btn primary big" id="w-open" data-i18n="welcome.open"></button><a class="btn big" id="w-star" href="#" target="_blank" rel="noopener" hidden data-i18n="welcome.star"></a></div>
          <div class="w-stats"><div><b>6</b><span data-i18n="welcome.stat.langs"></span></div><div><b>25</b><span data-i18n="welcome.stat.circuits"></span></div><div><b>0 €</b><span data-i18n="welcome.stat.free"></span></div></div>
        </div>
      </section>
      <section class="w-radar">
        <div class="w-map">
          <svg viewBox="0 0 640 420" role="img" aria-label="Rain radar demo">
            <defs><filter id="wblur"><feGaussianBlur stdDeviation="22"/></filter><pattern id="wgrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="currentColor" stroke-opacity=".08"/></pattern></defs>
            <rect width="640" height="420" fill="url(#wgrid)"/>
            <g filter="url(#wblur)" id="w-cells"></g>
            <path d="M120 300 C80 260 90 190 150 170 L260 140 C300 128 330 90 380 80 C440 68 500 100 520 150 C540 205 500 230 470 250 L430 270 C400 290 420 340 380 350 L240 360 C180 366 150 330 120 300 Z" class="tk0"/><path d="M120 300 C80 260 90 190 150 170 L260 140 C300 128 330 90 380 80 C440 68 500 100 520 150 C540 205 500 230 470 250 L430 270 C400 290 420 340 380 350 L240 360 C180 366 150 330 120 300 Z" class="tk1"/><path d="M120 300 C80 260 90 190 150 170 L260 140 C300 128 330 90 380 80 C440 68 500 100 520 150 C540 205 500 230 470 250 L430 270 C400 290 420 340 380 350 L240 360 C180 366 150 330 120 300 Z" class="tk2"/>
            <g class="tc"><g><circle cx="120" cy="300" r="11"/><text x="120" y="304" text-anchor="middle">1</text></g><g><circle cx="150" cy="170" r="11"/><text x="150" y="174" text-anchor="middle">2</text></g><g><circle cx="260" cy="140" r="11"/><text x="260" y="144" text-anchor="middle">3</text></g><g><circle cx="380" cy="80" r="11"/><text x="380" y="84" text-anchor="middle">4</text></g><g><circle cx="520" cy="150" r="11"/><text x="520" y="154" text-anchor="middle">5</text></g><g><circle cx="470" cy="250" r="11"/><text x="470" y="254" text-anchor="middle">6</text></g><g><circle cx="430" cy="270" r="11"/><text x="430" y="274" text-anchor="middle">7</text></g><g><circle cx="380" cy="350" r="11"/><text x="380" y="354" text-anchor="middle">8</text></g><g><circle cx="240" cy="360" r="11"/><text x="240" y="364" text-anchor="middle">9</text></g></g>
            <circle r="6" fill="#fff"><animateMotion dur="11s" repeatCount="indefinite" path="M120 300 C80 260 90 190 150 170 L260 140 C300 128 330 90 380 80 C440 68 500 100 520 150 C540 205 500 230 470 250 L430 270 C400 290 420 340 380 350 L240 360 C180 366 150 330 120 300 Z"/></circle>
          </svg>
          <span class="w-maplabel num"><span data-i18n="welcome.radar.label"></span> · <span id="w-step-label"></span></span>
          <span class="w-legend num"><span data-i18n="welcome.radar.legend.lo"></span><i></i><span data-i18n="welcome.radar.legend.hi"></span></span>
          <div class="w-steps"><button type="button" class="wstep" data-step="0" aria-pressed="true" data-i18n="welcome.step.0"></button><button type="button" class="wstep" data-step="1" aria-pressed="false" data-i18n="welcome.step.1"></button><button type="button" class="wstep" data-step="2" aria-pressed="false" data-i18n="welcome.step.2"></button><button type="button" class="wstep" data-step="3" aria-pressed="false" data-i18n="welcome.step.3"></button></div>
        </div>
        <div class="w-rtext">
          <p class="w-eyebrow num acc" data-i18n="welcome.radar.eyebrow"></p>
          <h2 data-i18n="welcome.radar.title"></h2>
          <p data-i18n="welcome.radar.text"></p>
          <ol><li><span class="num">01</span><span data-i18n="welcome.radar.p1"></span></li><li><span class="num">02</span><span data-i18n="welcome.radar.p2"></span></li><li><span class="num">03</span><span data-i18n="welcome.radar.p3"></span></li></ol>
        </div>
      </section>
      <section class="w-feat"><h2 data-i18n="welcome.features"></h2><div class="w-grid"><div class="wf"><span class="num">01</span><h3 data-i18n="welcome.f1.t"></h3><p data-i18n="welcome.f1.b"></p></div><div class="wf"><span class="num">02</span><h3 data-i18n="welcome.f2.t"></h3><p data-i18n="welcome.f2.b"></p></div><div class="wf"><span class="num">03</span><h3 data-i18n="welcome.f3.t"></h3><p data-i18n="welcome.f3.b"></p></div><div class="wf"><span class="num">04</span><h3 data-i18n="welcome.f4.t"></h3><p data-i18n="welcome.f4.b"></p></div><div class="wf"><span class="num">05</span><h3 data-i18n="welcome.f5.t"></h3><p data-i18n="welcome.f5.b"></p></div><div class="wf"><span class="num">06</span><h3 data-i18n="welcome.f6.t"></h3><p data-i18n="welcome.f6.b"></p></div></div></section>
      <section class="w-final"><h2 data-i18n="welcome.cta.title"></h2><p data-i18n="welcome.cta.text"></p><div class="w-cta"><button type="button" class="btn big w-dark" id="w-open2" data-i18n="welcome.open"></button><a class="btn big w-light" id="w-sponsor2" href="#" target="_blank" rel="noopener" hidden data-i18n="btn.donate"></a></div></section>
    </div>
  </div>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" id="brand-home" href="#" data-i18n-title="welcome.home"><i></i>Pitwall<span class="brand-live">&nbsp;Live</span></a>
      <button class="btn menu-toggle" id="btn-menu" type="button" aria-expanded="false" aria-controls="topmenu" data-i18n="btn.menu"></button>
      <div class="pickers" id="topmenu">
        <select id="sel-year" data-i18n-aria="aria.season"></select>
        <select id="sel-meeting" data-i18n-aria="aria.meeting"></select>
      </div>
      <div class="sessions" id="sessions" role="group" data-i18n-aria="aria.session"></div>
      <div class="tools" id="toolmenu">
        <button class="btn" id="btn-auto" type="button" aria-pressed="true" data-i18n="btn.auto" data-i18n-title="btn.auto.title"></button>
        <button class="btn" id="btn-compact" type="button" aria-pressed="false" data-i18n="btn.compact" data-i18n-title="btn.compact.title"></button>
        <button class="btn" id="btn-wake" type="button" aria-pressed="false" hidden data-i18n="btn.wake"></button>
        <button class="btn" id="btn-refresh" type="button" data-i18n-title="btn.refresh" aria-label="Refresh">↻</button>
        <button class="btn" id="btn-theme" type="button" data-i18n-title="btn.theme" aria-label="Theme">◐</button>
        <select id="sel-lang" class="btn" data-i18n-aria="aria.language"></select>
        <button class="btn" id="btn-settings" type="button" data-i18n="btn.live"></button>
        <a class="btn donate" id="btn-donate" href="#" target="_blank" rel="noopener" hidden data-i18n="btn.donate"></a>
      </div>
    </div>
  </header>

  <main>
    <div id="banners"></div>
    <section class="hero" id="hero"></section>
    <nav class="tabs" id="tabs" role="tablist" data-i18n-aria="aria.sections"></nav>
    <div id="panels"></div>
  </main>

  <footer class="foot">
    <div class="foot-grid">
      <div>
        <b class="foot-brand">Pitwall Live</b>
        <p data-i18n="foot.about"></p>
        <p id="foot-donate" hidden><span data-i18n="foot.donate"></span> <a id="foot-donate-link" href="#" target="_blank" rel="noopener" data-i18n="btn.donate"></a></p>
      </div>
      <div>
        <b data-i18n="foot.data"></b>
        <p data-i18n-html="foot.sources"></p>
        <p class="muted" id="foot-status"></p>
      </div>
      <div>
        <b data-i18n="foot.project"></b>
        <p><a id="foot-repo" href="#" target="_blank" rel="noopener" data-i18n="foot.source"></a> · <a id="foot-issues" href="#" target="_blank" rel="noopener" data-i18n="foot.issues"></a> · <button class="linklike" id="btn-about" type="button" data-i18n="foot.how"></button></p>
        <p class="muted" data-i18n="foot.disclaimer"></p>
      </div>
    </div>
  </footer>

  <dialog id="drvdlg">
    <div class="dh"><h2 id="drvdlg-title"></h2><button class="btn sm" style="margin-left:auto" type="button" id="drvdlg-close" data-i18n="btn.close"></button></div>
    <div class="db" id="drvdlg-body"></div>
  </dialog>

  <dialog id="aboutdlg">
    <div class="dh"><h2 data-i18n="about.title"></h2><button class="btn sm" style="margin-left:auto" type="button" id="aboutdlg-close" data-i18n="btn.close"></button></div>
    <div class="db prose" id="about-body"></div>
  </dialog>

  <dialog id="setdlg">
    <div class="dh"><h2 data-i18n="set.title"></h2><button class="btn sm" style="margin-left:auto" type="button" id="setdlg-close" data-i18n="btn.close"></button></div>
    <div class="db">
      <section class="stack-sec">
        <h3 data-i18n="set.relay.title"></h3>
        <p class="muted" data-i18n-html="set.relay.text"></p>
        <div id="relay-state"></div>
        <form class="stack" id="form-relay">
          <label><span data-i18n="set.relay.url"></span><input id="in-relay" type="url" placeholder="https://your-relay.example.com" autocomplete="off"></label>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit" data-i18n="set.relay.save"></button><button class="btn" type="button" id="btn-relay-clear" data-i18n="set.relay.clear"></button></div>
        </form>
      </section>
      <section class="stack-sec">
        <h3 data-i18n="set.of1.title"></h3>
        <p class="muted" data-i18n="set.of1.text"></p>
        <div id="set-state"></div>
        <form class="stack" id="form-login" autocomplete="on">
          <label><span data-i18n="set.user"></span><input id="in-user" name="username" autocomplete="username" required></label>
          <label><span data-i18n="set.pass"></span><input id="in-pass" name="password" type="password" autocomplete="current-password" required></label>
          <label class="check"><input type="checkbox" id="in-remember" checked> <span data-i18n="set.remember"></span></label>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit" data-i18n="set.login"></button><button class="btn" type="button" id="btn-logout" data-i18n="set.logout"></button></div>
        </form>
        <form class="stack" id="form-token">
          <label><span data-i18n="set.token"></span><input id="in-token" placeholder="eyJ..." autocomplete="off"></label>
          <div><button class="btn" type="submit" data-i18n="set.token.use"></button></div>
        </form>
      </section>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
